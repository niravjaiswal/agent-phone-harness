# The rest of CI runs against a fake adb. These jobs run the harness against a
# real Android emulator, so parser drift across Android versions shows up here
# instead of in someone's agent.
name: android

on:
  push:
    branches: [main]
  # Also on PRs that touch the code these jobs exercise, so a break shows up
  # before it reaches main rather than after.
  pull_request:
    paths:
      - "src/virtual/**"
      - "src/providers/android/**"
      - "src/core/exec.ts"
      - "scripts/e2e-android.mjs"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# Emulator jobs are slow; a newer push to the same ref supersedes the older run.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts && npm run build
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: node scripts/e2e-android.mjs

  # `agent-phone up` is the zero-hardware promise: SDK discovery, image install,
  # AVD creation and a headless boot. Exercise it on a clean runner.
  up:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts && npm run build
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: node dist/cli.js doctor || true
      - run: node dist/cli.js up --api 34 --variant google_apis
      - run: node dist/cli.js devices
      - run: node scripts/e2e-android.mjs
      - name: emulator diagnostics
        if: failure()
        run: |
          ls -l /dev/kvm || true
          nproc; free -m
          ls -la ~/.android/avd || true
          cat ~/.android/avd/agent-phone.avd/config.ini 2>/dev/null | sort || true
          for f in ~/.agent-phone/logs/*.log; do echo "=== $f"; tail -n 150 "$f"; done
      - if: always()
        run: node dist/cli.js down || true
