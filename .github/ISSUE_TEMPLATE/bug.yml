name: Bug report
description: Something the harness did wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What the agent or you did, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: agent-phone --version
    validations:
      required: true
  - type: dropdown
    id: phone
    attributes:
      label: Phone
      options:
        - agent-phone up (emulator)
        - container (redroid)
        - physical Android
        - iOS simulator
        - physical iPhone
        - mock
    validations:
      required: true
  - type: textarea
    id: trace
    attributes:
      label: Trace
      description: Output of `agent-phone trace <session>` around the problem. Traces are redacted, but check before pasting.
      render: text
