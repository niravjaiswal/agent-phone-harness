name: Feature request
description: Something the harness should do
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: The task
      description: What were you (or your agent) trying to get done on a phone?
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: What got in the way
    validations:
      required: true
