# A virtual phone in a container. No Android SDK on the host, no emulator, no handset.
#
# Redroid runs Android against the host kernel, so it is far lighter than a QEMU
# emulator and several can share one machine. It needs binder/ashmem kernel
# modules, which means a Linux host — on macOS or Windows use `agent-phone up`
# instead, which drives a normal emulator.
#
# Just the phone, for running the harness yourself on the same Linux machine
# (`agent-phone serve`). For the full hosted stack use compose.yml.
#
#   docker compose -f deploy/phone-only.compose.yml up -d
#   adb connect localhost:5555
#   agent-phone doctor
#
# The port is bound to loopback: adb has no encryption, so it must never be
# reachable from the network. Scale by copying the phone-1 block with the next
# port and its own volume.

services:
  phone-1:
    image: redroid/redroid:14.0.0-latest
    container_name: agent-phone-1
    privileged: true
    ports:
      - "127.0.0.1:5555:5555"
    volumes:
      - phone-1-data:/data
    command:
      - androidboot.redroid_width=1080
      - androidboot.redroid_height=2340
      - androidboot.redroid_dpi=420
      - androidboot.redroid_gpu_mode=guest

volumes:
  phone-1-data:
