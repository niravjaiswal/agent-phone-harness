# The whole phone host: Android in a container, the harness next to it, and a
# tunnel so a cloud agent can reach it. See docs/hosting.md.
#
#   ./deploy/install.sh          # does all of this for you on a fresh VM
#
# or by hand:
#
#   cp deploy/.env.example deploy/.env
#   docker compose -f deploy/compose.yml up -d --build
#   docker compose -f deploy/compose.yml exec harness agent-phone connect-info --wait 60
#
# Requires a Linux host with the binder kernel module (install.sh loads it).

name: agent-phone

services:
  phone:
    image: redroid/redroid:${REDROID_TAG:-14.0.0-latest}
    privileged: true
    restart: unless-stopped
    volumes:
      - phone-data:/data
    command:
      - androidboot.redroid_width=${PHONE_WIDTH:-1080}
      - androidboot.redroid_height=${PHONE_HEIGHT:-2340}
      - androidboot.redroid_dpi=${PHONE_DPI:-420}
      - androidboot.redroid_gpu_mode=guest
    # No ports. adb has no encryption and no real authentication here; only the
    # harness reaches it, over the compose network.

  harness:
    build: ..
    image: ${HARNESS_IMAGE:-ghcr.io/niravjaiswal/agent-phone-harness:latest}
    restart: unless-stopped
    depends_on: [phone]
    env_file:
      - path: .env
        required: false
    environment:
      PHONE_ADB_CONNECT: phone:5555
      PHONE_TUNNEL_METRICS: http://tunnel:2000
    volumes:
      - harness-data:/data
    ports:
      # Loopback only: for you on the VM (ssh -L 8712:127.0.0.1:8712 vm).
      # The world reaches the harness through the tunnel.
      - "127.0.0.1:${PHONE_LOCAL_PORT:-8712}:8712"

  # Quick tunnel: no Cloudflare account, random https://*.trycloudflare.com
  # URL that changes when the tunnel restarts.
  tunnel:
    image: cloudflare/cloudflared:${CLOUDFLARED_TAG:-latest}
    restart: unless-stopped
    profiles: [quick]
    depends_on: [harness]
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://harness:8712

  # Named tunnel: a stable hostname you route to http://harness:8712 in the
  # Cloudflare dashboard. Set CLOUDFLARE_TUNNEL_TOKEN and PHONE_PUBLIC_URL.
  tunnel-named:
    image: cloudflare/cloudflared:${CLOUDFLARED_TAG:-latest}
    restart: unless-stopped
    profiles: [named]
    depends_on: [harness]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run

volumes:
  phone-data:
  harness-data:
